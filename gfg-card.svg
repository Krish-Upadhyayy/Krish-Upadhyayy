<svg fill="none" width="450" height="190" viewBox="0 0 450 190" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gfgBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="gfgAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#298d46"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>

  <!-- Base Card -->
  <rect width="450" height="190" rx="10" fill="url(#gfgBg)" stroke="#30363d" stroke-width="1"/>
  <rect width="450" height="4" rx="2" fill="url(#gfgAccent)"/>

  <!-- Brand Logo Container -->
  <rect x="25" y="25" width="44" height="44" rx="10" fill="#298d46" fill-opacity="0.15" stroke="#298d46" stroke-width="1.5"/>
  <text x="47" y="53" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="900" font-size="22" fill="#298d46" text-anchor="middle">gfg</text>

  <!-- Title & Username -->
  <text x="82" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="18" fill="#ffffff">
    GeeksforGeeks
  </text>
  <text x="82" y="60" font-family="monospace" font-weight="600" font-size="13" fill="#34d399">
    @krishupadhyay
  </text>

  <!-- Metric Badges Row -->
  <g transform="translate(25, 90)">
    <!-- Pill 1: Focus -->
    <rect x="0" y="0" width="125" height="30" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="12" y="19" font-family="-apple-system, sans-serif" font-size="11" font-weight="500" fill="#8b949e">Domain</text>
    <text x="113" y="19" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="end">DSA / Logic</text>

    <!-- Pill 2: Status -->
    <rect x="138" y="0" width="125" height="30" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="150" y="19" font-family="-apple-system, sans-serif" font-size="11" font-weight="500" fill="#8b949e">Practice</text>
    <text x="251" y="19" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#34d399" text-anchor="end">Active</text>

    <!-- Pill 3: Platform -->
    <rect x="276" y="0" width="124" height="30" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="288" y="19" font-family="-apple-system, sans-serif" font-size="11" font-weight="500" fill="#8b949e">Level</text>
    <text x="388" y="19" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="end">Problem Solver</text>
  </g>

  <!-- Footer Tagline -->
  <text x="25" y="160" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#8b949e">
    Continuous coding practice & algorithmic problem solving
  </text>

  <!-- Direct Link Arrow Indicator -->
  <text x="425" y="160" font-family="-apple-system, sans-serif" font-size="14" font-weight="bold" fill="#298d46" text-anchor="end">
    ➔
  </text>
</svg>
